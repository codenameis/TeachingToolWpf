<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" role="img" aria-labelledby="title"><title id="title">새 ROI: 초안 생성, 확정, 취소는 서로 다른 출구</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#255b70"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Segoe UI,Malgun Gothic,sans-serif" fill="#173544"><text x="24" y="30" font-size="20">새 ROI: 초안 생성, 확정, 취소는 서로 다른 출구</text><rect x="11.0" y="50" width="188" height="42" rx="6" fill="#e7f1f5" stroke="#255b70"/><text x="19.0" y="76" font-size="14">호스트 입력</text><line x1="105.0" y1="92" x2="105.0" y2="770" stroke="#9cabb2" stroke-dasharray="5 5"/><rect x="274.3333333333333" y="50" width="188" height="42" rx="6" fill="#e7f1f5" stroke="#255b70"/><text x="282.3333333333333" y="76" font-size="14">InteractionController</text><line x1="368.3333333333333" y1="92" x2="368.3333333333333" y2="770" stroke="#9cabb2" stroke-dasharray="5 5"/><rect x="537.6666666666666" y="50" width="188" height="42" rx="6" fill="#e7f1f5" stroke="#255b70"/><text x="545.6666666666666" y="76" font-size="14">DrawGesture</text><line x1="631.6666666666666" y1="92" x2="631.6666666666666" y2="770" stroke="#9cabb2" stroke-dasharray="5 5"/><rect x="801.0" y="50" width="188" height="42" rx="6" fill="#e7f1f5" stroke="#255b70"/><text x="809.0" y="76" font-size="14">EditorSession</text><line x1="895.0" y1="92" x2="895.0" y2="770" stroke="#9cabb2" stroke-dasharray="5 5"/><line x1="105.0" y1="132" x2="368.3333333333333" y2="132" stroke="#255b70" stroke-width="1.5" marker-end="url(#arrow)"/><text x="113.0" y="122" font-size="13">1. Down → 그리기 도구 선택</text><line x1="368.3333333333333" y1="196" x2="631.6666666666666" y2="196" stroke="#255b70" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376.3333333333333" y="186" font-size="13">2. 생성: 시작점 저장</text><line x1="105.0" y1="260" x2="368.3333333333333" y2="260" stroke="#255b70" stroke-width="1.5" marker-end="url(#arrow)"/><text x="113.0" y="250" font-size="13">3. Move</text><line x1="368.3333333333333" y1="324" x2="631.6666666666666" y2="324" stroke="#255b70" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376.3333333333333" y="314" font-size="13">4. Move → 형상 초안 계산</text><line x1="631.6666666666666" y1="388" x2="368.3333333333333" y2="388" stroke="#255b70" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376.3333333333333" y="378" font-size="13">5. Show(Draft, DragArea)</text><line x1="105.0" y1="452" x2="368.3333333333333" y2="452" stroke="#255b70" stroke-width="1.5" marker-end="url(#arrow)"/><text x="113.0" y="442" font-size="13">6. Up이면 마지막 Move + Complete</text><line x1="631.6666666666666" y1="516" x2="368.3333333333333" y2="516" stroke="#255b70" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376.3333333333333" y="506" font-size="13">7. AddDrawnRoi(draft)</text><line x1="368.3333333333333" y1="580" x2="895.0" y2="580" stroke="#255b70" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376.3333333333333" y="570" font-size="13">8. Add 또는 AddChild</text><line x1="105.0" y1="644" x2="368.3333333333333" y2="644" stroke="#255b70" stroke-width="1.5" marker-end="url(#arrow)"/><text x="113.0" y="634" font-size="13">9. 별도 경우: Escape / 캡처 상실</text><line x1="368.3333333333333" y1="708" x2="631.6666666666666" y2="708" stroke="#255b70" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376.3333333333333" y="698" font-size="13">10. Cancel → 초안 폐기; 문서 추가 없음</text></g></svg>